server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Resolve api-gateway per request (not at startup) so nginx can start
    # before the gateway Service exists; /api returns 502 until it does.
    # ${NGINX_LOCAL_RESOLVERS} and ${POD_NAMESPACE} are filled in by the
    # nginx image's envsubst step at container start.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    location /api/ {
        set $api_upstream http://api-gateway.${POD_NAMESPACE}.svc.cluster.local:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}